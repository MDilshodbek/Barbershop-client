# Cropper frontend: lint -> build image + push to GHCR -> deploy on the server.
# Runs only on pushes to master (and manual runs). No pull_request trigger,
# so code from forks never runs here.
name: Deploy frontend

on:
  push:
    branches: [master]
  workflow_dispatch:

# never run two deploys at the same time; a newer push waits for the running one
concurrency:
  group: deploy-frontend
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/mdilshodbek/barbershop-client

jobs:
  lint:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile --network-timeout 600000

      # report-only: warnings/errors are shown but never fail the run
      - name: Lint (report-only)
        run: yarn lint
        continue-on-error: true

      - name: Typecheck
        run: npx tsc --noEmit

  build:
    name: Build and push image
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v5

      # the API URLs are baked into the JS bundle, so they must exist before building
      - name: Check build variables
        env:
          REACT_APP_API_URL: ${{ vars.REACT_APP_API_URL }}
          REACT_APP_API_GRAPHQL_URL: ${{ vars.REACT_APP_API_GRAPHQL_URL }}
          REACT_APP_API_WS: ${{ vars.REACT_APP_API_WS }}
        run: |
          missing=0
          for name in REACT_APP_API_URL REACT_APP_API_GRAPHQL_URL REACT_APP_API_WS; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository variable $name is not set (Settings > Secrets and variables > Actions > Variables)"
              missing=1
            else
              echo "$name=${!name}"
            fi
          done
          exit $missing

      - name: Image tag
        id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/MDilshodbek/Barbershop-client
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            REACT_APP_API_URL=${{ vars.REACT_APP_API_URL }}
            REACT_APP_API_GRAPHQL_URL=${{ vars.REACT_APP_API_GRAPHQL_URL }}
            REACT_APP_API_WS=${{ vars.REACT_APP_API_WS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to server
    needs: build
    runs-on: [self-hosted, barbershop-client]
    permissions:
      contents: read
      packages: read
    env:
      APP_DIR: ${{ vars.APP_DIR }}
    steps:
      - name: Check APP_DIR
        run: |
          # keep the GHCR login inside this job only (not in the deploy user's ~/.docker)
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker-config" >> "$GITHUB_ENV"
          if [ -z "$APP_DIR" ]; then
            echo "::error::Repository variable APP_DIR is not set"
            exit 1
          fi
          if [ ! -d "$APP_DIR" ]; then
            echo "::error::Folder $APP_DIR does not exist on the server"
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            /docker-compose.yml
            /deploy.sh
          sparse-checkout-cone-mode: false

      - name: Copy deploy files
        run: |
          install -m 644 docker-compose.yml "$APP_DIR/docker-compose.yml"
          install -m 755 deploy.sh "$APP_DIR/deploy.sh"

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Deploy ${{ needs.build.outputs.tag }}
        run: |
          "$APP_DIR/deploy.sh" "${{ needs.build.outputs.tag }}"

      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io || true
