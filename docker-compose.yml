
services:
  barbershop-client:
    container_name: barbershop-client
    restart: always
    image: node:20.10.0
    ports:
      - 4000:3000
    environment:
      - PORT=3000

    volumes:
      - ./:/usr/src/barbershop-client
    working_dir: /usr/src/barbershop-client

    networks:
      - client_network

    command: bash -c "yarn && yarn run build && yarn run start"

networks:
  client_network:
    driver: bridge
